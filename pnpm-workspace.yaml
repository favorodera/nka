
shellEmulator: true


trustPolicy: no-downgrade


allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

packages:
  - 'packages/*'
  - 'adapters/*'

catalogs:
  tooling:
    '@favorodera/eslint-config': ^1.0.4
    '@types/node': ^26.1.2
    eslint: ^10.8.0
    relizy: ^1.4.9
    turbo: ^2.10.7
    typescript: ^6.0.3

nodeOptions: --max_old_space_size=4096
