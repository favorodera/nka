name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        type: choice
        options:
          - Select a version bump
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor

      prerelease_id:
        description: 'Prerelease identifier, such as alpha or beta'
        required: false
        type: string
        default: alpha

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      bump_arguments: ${{ steps.build_arguments.outputs.bump_arguments }}
      publish_arguments: ${{ steps.build_arguments.outputs.publish_arguments }}
    steps:
      - name: Validate Inputs
        id: validate_inputs
        run: |
          BUMP="${{ inputs.bump }}"
          PRERELEASE_ID="${{ inputs.prerelease_id }}"

          if [[ "$BUMP" =~ ^(patch|minor|major)$ ]]; then
            echo "Valid stable release bump: $BUMP"
            exit 0
          fi

          if [[ "$BUMP" =~ ^(prerelease|prepatch|preminor|premajor)$ ]]; then
            if [[ -z "$PRERELEASE_ID" ]]; then
              echo "::error::A prerelease identifier is required for prerelease releases."
              exit 1
            fi
            echo "Valid prerelease bump: $BUMP"
            echo "Prerelease identifier: $PRERELEASE_ID"
            exit 0
          fi

          echo "::error::Invalid release bump type: $BUMP"
          exit 1

      - name: Build Arguments
        id: build_arguments
        run: |
          BUMP="${{ inputs.bump }}"
          PRERELEASE_ID="${{ inputs.prerelease_id }}"

          if [[ "$BUMP" =~ ^(patch|minor|major)$ ]]; then
            echo "bump_arguments=--$BUMP" >> "$GITHUB_OUTPUT"
            echo "publish_arguments=" >> "$GITHUB_OUTPUT"
          else
            echo "bump_arguments=--$BUMP --preid $PRERELEASE_ID" >> "$GITHUB_OUTPUT"
            echo "publish_arguments=--tag $PRERELEASE_ID" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: Bump & Commit (${{ inputs.bump }})
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      release_commit_sha: ${{ steps.commit.outputs.release_commit_sha }}
      release_branch: ${{ steps.commit.outputs.release_branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "favorodera"
          git config --global user.email "favorodera@gmail.com"

      - name: Bump version
        id: bump
        run: |
          pnpm relizy bump ${{ needs.validate.outputs.bump_arguments }} --yes
          VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$VERSION"

      - name: Generate JSON schemas
        run: pnpm --filter='@nka/registry' generate-json-schemas

      - name: Build registry
        run: pnpm --filter='@nka/registry' build-registry

      - name: Lint
        run: pnpm lint

      - name: Build Packages
        run: pnpm build --filter='./packages/*'

      - name: Create changelog
        run: pnpm relizy changelog

      - name: Commit, tag & push to temporary release branch
        id: commit
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="release/v${VERSION}"

          git checkout -b "${BRANCH}"

          git add .
          git commit -m "chore(release): v${VERSION}" || echo "Nothing to commit"

          git tag "v${VERSION}"

          git push origin "${BRANCH}"
          git push origin "v${VERSION}"

          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: [validate, bump]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.bump.outputs.release_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build --filter='./packages/*'

      - name: Publish with Relizy
        run: pnpm relizy publish ${{ needs.validate.outputs.publish_arguments }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [validate, bump, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.bump.outputs.release_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create GitHub Release
        run: pnpm relizy provider-release
        env:
          RELIZY_GITHUB_TOKEN: ${{ secrets.PAT }}

  create-pr:
    name: Open Release PR
    needs: [bump, publish, github-release]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const version = '${{ needs.bump.outputs.new_version }}';
            const branch = '${{ needs.bump.outputs.release_branch }}';
            const base = '${{ github.ref_name }}';

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(release): v${version}`,
              head: branch,
              base: base,
              body: [
                `Automated release PR for **v${version}**.`,
                ``,
                `- Packages published to npm`,
                `- GitHub Release created`,
                `- Ready for review & merge`
              ].join('\n')
            });

  cleanup:
    name: Cleanup failed release branch
    needs: [bump, publish, github-release]
    if: failure() && needs.bump.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branch + tag
        run: |
          VERSION="${{ needs.bump.outputs.new_version }}"
          BRANCH="${{ needs.bump.outputs.release_branch }}"

          echo "Cleaning up failed release: ${BRANCH} and tag v${VERSION}"

          git config --global user.name "favorodera"
          git config --global user.email "favorodera@gmail.com"

          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git repo
          cd repo

          git push origin --delete "${BRANCH}" || true
          git push origin ":refs/tags/v${VERSION}" || true